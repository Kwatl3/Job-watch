name: Discover career sites

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only companies whose name contains this text (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/discover.py "${{ github.event.inputs.only }}"
      - name: Commit result
        run: |
          git config user.name "job-watch-bot"
          git config user.email "job-watch-bot@users.noreply.github.com"
          git add docs/discovery.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update career-site discovery"
          git pull --rebase
          git push
