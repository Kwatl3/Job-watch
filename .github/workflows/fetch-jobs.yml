name: Fetch jobs

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes: companies with tier "fast" (GitHub may delay runs under load)
    - cron: "17 */6 * * *"   # every 6 hours: companies with tier "slow"
  workflow_dispatch:          # "Run workflow" button in the Actions tab
    inputs:
      tier:
        description: "Which companies to check: all, fast or slow"
        default: "all"
  push:
    paths:
      - companies.yml
      - scripts/**

permissions:
  contents: write

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch jobs
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TIER: ${{ github.event.inputs.tier }}
        run: |
          TIER=all
          if [ "$SCHEDULE" = "*/30 * * * *" ]; then TIER=fast; fi
          if [ "$SCHEDULE" = "17 */6 * * *" ]; then TIER=slow; fi
          if [ -n "$INPUT_TIER" ]; then TIER="$INPUT_TIER"; fi
          python scripts/fetch_jobs.py --tier "$TIER"

      - name: Commit changes
        run: |
          git config user.name "job-dashboard-bot"
          git config user.email "job-dashboard-bot@users.noreply.github.com"
          git add docs/jobs.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update jobs"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push
          fi
