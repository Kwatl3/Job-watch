name: Fetch jobs

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay runs under load)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    paths:
      - companies.yml
      - scripts/**

permissions:
  contents: write

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch jobs
        run: python scripts/fetch_jobs.py

      - name: Commit changes
        run: |
          git config user.name "job-dashboard-bot"
          git config user.email "job-dashboard-bot@users.noreply.github.com"
          git add docs/jobs.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update jobs"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
