# Companies to watch. Edit this file on GitHub (pencil icon), commit, and the next run picks it up.
#
# Feed types:
#   arbeitsagentur  German job-agency feed (arbeitsagentur.de): jobs located in Germany, found by
#                   employer name. Works for most German employers, including those whose own career
#                   site cannot be read automatically. It only contains jobs the employer posts there.
#   workday | greenhouse | lever | smartrecruiters | personio | html   a company's own career system
#
# tier: fast = checked every 30 minutes (default), slow = every 6 hours.
# Per company you can add: include / exclude (title keywords), keywords, where + radius_km (arbeitsagentur),
# max_pages (how many pages of 100 jobs to read).

# Your profile: process / manufacturing / production engineering, product development, quality,
# configuration management. A job is kept only if its TITLE contains a core or related word.
# Core words give the job a star badge and the dashboard's "Best matches only" filter.
# (Words of 4 letters or fewer must start a word, so "lean" matches "Lean Manager" but not "Clean Room".)
profile:
  core: [prozessingenieur, process engineer, prozessentwickl, process development, manufacturing,
         fertigungsingenieur, produktionsingenieur, production engineer, industrial engineer, industriali,
         fertigungsplan, produktionsplan, arbeitsvorbereitung, arbeitsplanung, produktionstechnik,
         fertigungstechnik, montageplan, konfigurationsmanag, configuration manag, änderungsmanag,
         change manag, fmea, additive, additiv, 3d-druck, 3d druck, 3d print, generativ, lpbf, slm, l-pbf, powder bed, lean, kvp, kaizen, mtm, produktentwickl, product development, product developer,
         entwicklungsingenieur, development engineer, konstrukteur, konstruktion, design engineer,
         product engineer, catia, solidworks, solid works, 3dx, 3dexperience, 3d experience, plm,
         fertigungsentwickl, produktionsentwickl, manufacturing development, product design,
         produktdesign, mechanical design, design engineering, r&d, f&e, forschung und entwicklung]
  related: [ingenieur, engineer, prozess, process, fertigung, produktion, production, industrial, qualit,
            technolog, mechanical, maschinenbau, mechatronik, systemingenieur, systems engineer,
            system engineer, projektingenieur, project engineer, entwicklung, development,
            montageingenieur, assembly engineer, aerospace, luftfahrt, raumfahrt, prüfingenieur, test engineer]

filters:
  # Jobs whose title contains one of these words are dropped (checked after the profile words above).
  exclude: [werkstudent, praktikum, internship, student, thesis, abschlussarbeit, ausbildung, azubi, minijob,
            software, devops, administrator, sales, vertrieb, marketing, recruit, personalentwicklung,
            business development, buchhalt, finanz]
  locations: []
  # Used by companies with "locations: de" (Germany only): a job passes if its location says DE / Germany /
  # Deutschland, or contains one of these places.
  de_locations: [Hamburg, Bremen, Berlin, München, Munich, Ottobrunn, Taufkirchen, Manching, Augsburg, Stuttgart,
                 Ulm, Friedrichshafen, Überlingen, Oberkochen, Koblenz, Kiel, Rostock, Lemwerder, Varel, Stade,
                 Buxtehude, Nordenham, Donauwörth, Immenstaad, Bonn, Köln, Cologne, Düsseldorf, Unterlüß, Kassel,
                 Nürnberg, Nuremberg, Erlangen, Karlsruhe, Mannheim, Frankfurt, Hannover, Darmstadt, Dresden, Leipzig,
                 Jena, Oberpfaffenhofen, Weßling, Wessling, Aachen, Dortmund, Essen, Neuburg, Laupheim, Speyer, Wetzlar]

closed_retention_days: 14   # closed jobs stay visible (greyed out) this long
new_window_hours: 48        # how long a job carries the NEW badge
workers: 4

companies:
